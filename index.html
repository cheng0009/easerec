<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>简录 EaseRec</title>
    <style>
      /* -------- Startup splash (pure CSS, removed on React mount) -------- */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
      }
      #splash::before {
        content: "";
        position: absolute;
        inset: 0;
        background: #000;
      }
      .splash-stage {
        position: relative;
        width: clamp(150px, 20vw, 280px);
        aspect-ratio: 1254 / 662;
      }
      .splash-stage img {
        position: absolute;
        width: auto;
        height: auto;
      }
      .sp-red-dot {
        left: 14.6%;
        top: 47.1%;
        width: 8.4% !important;
        opacity: 0;
        animation: sp-blink 900ms cubic-bezier(0.22, 1, 0.36, 1) 0ms both;
      }
      .sp-wave { opacity: 0; width: 17.1% !important; }
      .sp-wave-1 { left: 24.3%; top: 45.5%; animation: sp-fade-up 480ms cubic-bezier(0.22, 1, 0.36, 1) 680ms both; }
      .sp-wave-2 { left: 24.3%; top: 52.3%; animation: sp-fade-up 480ms cubic-bezier(0.22, 1, 0.36, 1) 800ms both; }
      .sp-wave-3 { left: 24.3%; top: 59.2%; animation: sp-fade-up 480ms cubic-bezier(0.22, 1, 0.36, 1) 920ms both; }
      .sp-frame {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
      }
      .sp-frame path {
        fill: none;
        stroke: #91918f;
        stroke-width: 15;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: sp-draw 1300ms cubic-bezier(0.22, 1, 0.36, 1) 1320ms both;
      }
      .sp-star { animation: sp-bounce 720ms cubic-bezier(0.34, 1.56, 0.64, 1) both; }
      .sp-star-1 { width: 10.5% !important; left: 7.1%; top: 8.6%; animation-delay: 1680ms; }
      .sp-star-2 { width: 8.7% !important; left: 40.7%; top: 13.7%; animation-delay: 1400ms; }
      .sp-star-3 { width: 7.7% !important; left: 4.8%; top: 75.8%; animation-delay: 2010ms; }
      .sp-panel {
        left: 51%;
        top: 5%;
        width: 44.9% !important;
        opacity: 0;
        animation: sp-slide-left 620ms cubic-bezier(0.22, 1, 0.36, 1) 1980ms both;
      }
      .sp-circle { width: 5.8% !important; top: 77.9%; animation: sp-pop 480ms cubic-bezier(0.34, 1.56, 0.64, 1) both; }
      .sp-circle-1 { left: 55.4%; animation-delay: 2560ms; }
      .sp-circle-2 { left: 69.3%; animation-delay: 2680ms; }
      .sp-circle-3 { left: 83.1%; animation-delay: 2800ms; }
      .sp-full {
        inset: 0;
        width: 100% !important;
        height: 100% !important;
        opacity: 0;
        animation: sp-fade-in 650ms cubic-bezier(0.22, 1, 0.36, 1) 2960ms both;
      }

      /* --- Element keyframes --- */
      @keyframes sp-blink {
        0%   { opacity: 0; transform: scale(0.5); }
        18%  { opacity: 1; transform: scale(1.08); }
        38%  { opacity: 0; transform: scale(1); }
        58%  { opacity: 1; transform: scale(1.05); }
        74%  { opacity: 0; transform: scale(1); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes sp-fade-up {
        0%   { opacity: 0; transform: translateY(40%) scale(0.8); }
        70%  { opacity: 1; }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes sp-bounce {
        0%   { opacity: 0; transform: translateY(-300%) scale(0.4) rotate(-8deg); }
        55%  { opacity: 1; transform: translateY(12%) scale(1.15) rotate(3deg); }
        75%  { transform: translateY(-6%) scale(0.95); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes sp-slide-left {
        0%   { opacity: 0; transform: translateX(35%); }
        60%  { opacity: 1; }
        100% { opacity: 1; transform: translateX(0); }
      }
      @keyframes sp-pop {
        0%   { opacity: 0; transform: scale(0); }
        70%  { opacity: 1; transform: scale(1.18); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes sp-fade-in {
        0%   { opacity: 0; transform: scale(1.02); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes sp-draw {
        from { stroke-dashoffset: 1; }
        to   { stroke-dashoffset: 0; }
      }

      /* --- Splash exit (fade + slight scale, added by React on unmount) --- */
      #splash.splash-exit {
        pointer-events: none;
        animation: splash-out 420ms cubic-bezier(0.4, 0, 0.6, 1) forwards;
      }
      @keyframes splash-out {
        to { opacity: 0; transform: scale(1.03); }
      }

      /* --- Reduced motion: show full logo immediately --- */
      @media (prefers-reduced-motion: reduce) {
        #splash { background: #000; }
        #splash::before { background: #000; }
        .splash-stage .sp-red-dot,
        .splash-stage .sp-wave,
        .splash-stage .sp-star,
        .splash-stage .sp-frame,
        .splash-stage .sp-panel,
        .splash-stage .sp-circle { display: none !important; }
        .sp-full { display: block !important; opacity: 1 !important; transform: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" aria-hidden="true">
      <div class="splash-stage">
        <svg class="sp-frame" viewBox="0 0 1254 662" aria-hidden="true">
          <path pathLength="1" d="M 547.5 257.5 A 90 90 0 0 0 457.5 167.5 L 237.5 167.5 A 90 90 0 0 0 147.5 257.5 L 147.5 469.5 A 90 90 0 0 0 237.5 559.5 L 457.5 559.5 A 90 90 0 0 0 547.5 469.5 L 547.5 257.5 Z" />
        </svg>
        <img class="sp-red-dot" src="splash/red_dot.png" alt="" />
        <img class="sp-wave sp-wave-1" src="splash/wave1.png" alt="" />
        <img class="sp-wave sp-wave-2" src="splash/wave2.png" alt="" />
        <img class="sp-wave sp-wave-3" src="splash/wave3.png" alt="" />
        <img class="sp-star sp-star-1" src="splash/star1.png" alt="" />
        <img class="sp-star sp-star-2" src="splash/star2.png" alt="" />
        <img class="sp-star sp-star-3" src="splash/star3.png" alt="" />
        <img class="sp-panel" src="splash/right_panel.png" alt="" />
        <img class="sp-circle sp-circle-1" src="splash/circle1.png" alt="" />
        <img class="sp-circle sp-circle-2" src="splash/circle2.png" alt="" />
        <img class="sp-circle sp-circle-3" src="splash/circle3.png" alt="" />
        <img class="sp-full" src="splash/lgo.png" alt="简录 EaseRec" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
